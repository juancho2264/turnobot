# Corre los tests del backend en cada push y pull request.
# Si algo se rompe, GitHub lo marca con una ❌ antes de que llegue a producción.
name: Tests

on:
  push:
    paths: [backend/**, .github/workflows/tests.yml]
  pull_request:
    paths: [backend/**]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - run: mvn -B test
        working-directory: backend
